name: Build macOS app

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  build:
    name: Build .app / .dmg (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch ffmpeg sidecars
        run: bash scripts/fetch-ffmpeg.sh aarch64-apple-darwin
      - name: Build app bundle and dmg
        run: pnpm tauri build --target aarch64-apple-darwin --bundles app,dmg
      - name: Smoke test bundled ffmpeg
        run: |
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/LightPlayer.app"
          ls -la "$APP/Contents/MacOS"
          "$APP/Contents/MacOS/ffprobe" -hide_banner -version | head -1
          codesign -dv "$APP" 2>&1 | head -5 || true
      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: LightPlayer-macOS-arm64-dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Upload zipped .app
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          ditto -c -k --keepParent LightPlayer.app LightPlayer.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LightPlayer-macOS-arm64-app
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/LightPlayer.app.zip
