name: Build macOS & Windows apps

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v1.0.0); leave empty to just build"
        required: false
        default: ""
      prerelease:
        description: "Mark the release as a prerelease"
        type: boolean
        required: false
        default: true
      replace:
        description: "Delete an existing release and tag with the same name first"
        type: boolean
        required: false
        default: false

concurrency:
  # Release runs get their own group so a later push can't cancel them.
  group: macos-${{ github.ref }}-${{ inputs.release_tag || 'build' }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install system dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          # man-db triggers make apt extremely slow on ubuntu-24.04 runners.
          sudo rm -f /var/lib/man-db/auto-update
          sudo -E apt-get update
          sudo -E apt-get install -y --no-install-recommends -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  build:
    name: Build .app / .dmg (Apple Silicon)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch ffmpeg sidecars
        run: bash scripts/fetch-ffmpeg.sh aarch64-apple-darwin
      - name: Build app bundle and dmg
        run: pnpm tauri build --target aarch64-apple-darwin --bundles app,dmg
      - name: Smoke test bundled ffmpeg
        run: |
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/LightPlayer.app"
          ls -la "$APP/Contents/MacOS"
          "$APP/Contents/MacOS/ffprobe" -hide_banner -version | head -1
          codesign -dv "$APP" 2>&1 | head -5 || true
      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: LightPlayer-macOS-arm64-dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Upload zipped .app
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          ditto -c -k --keepParent LightPlayer.app LightPlayer.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LightPlayer-macOS-arm64-app
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/LightPlayer.app.zip
      - name: UI screenshot (best effort)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          APP="$PWD/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/LightPlayer.app"
          SHOTS="$RUNNER_TEMP/shots"
          mkdir -p "$SHOTS"
          "$APP/Contents/MacOS/ffmpeg" -loglevel error -y -f lavfi -i testsrc2=size=1280x720:rate=30 \
            -f lavfi -i sine=frequency=440 -t 20 -c:v libx264 -pix_fmt yuv420p -c:a aac "$RUNNER_TEMP/test.mp4"
          open -n "$APP" --args "$RUNNER_TEMP/test.mp4"
          sleep 10
          screencapture -x "$SHOTS/window.png"
          sleep 4
          screencapture -x "$SHOTS/window-later.png"
          osascript -e 'quit app "LightPlayer"' || pkill -f LightPlayer.app || true
          ls -la "$SHOTS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
      - name: Speech recognition smoke test (Metal)
        env:
          LP_ASR_MODEL_DIR: ${{ runner.temp }}/models
          LP_ASR_AUDIO: ${{ runner.temp }}/speech.aiff
        run: |
          mkdir -p "$LP_ASR_MODEL_DIR"
          curl -fL --retry 3 -o "$LP_ASR_MODEL_DIR/ggml-tiny.bin" https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          curl -fL --retry 3 -o "$LP_ASR_MODEL_DIR/ggml-silero-v5.1.2.bin" https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v5.1.2.bin
          say -o "$LP_ASR_AUDIO" "Welcome to the light player. This music player can recognise song lyrics on your computer."
          export LIGHTPLAYER_FFMPEG_DIR="$PWD/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/LightPlayer.app/Contents/MacOS"
          cd src-tauri
          cargo test --release --target aarch64-apple-darwin asr_smoke -- --ignored --nocapture

  build-windows:
    name: Build installer (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Build whisper.cpp for a fixed instruction set (AVX2), not the runner's
      # CPU, so the app runs on any recent x64 PC.
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch ffmpeg sidecars
        shell: bash
        run: bash scripts/fetch-ffmpeg.sh x86_64-pc-windows-msvc
      - name: Build installer
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis
      - name: Smoke test bundled ffmpeg and package the portable version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rel = "src-tauri/target/x86_64-pc-windows-msvc/release"
          $exes = (Get-ChildItem $rel -Filter *.exe | ForEach-Object Name) -join ", "
          $setup = (Get-ChildItem "$rel/bundle/nsis" -Filter *.exe | ForEach-Object Name) -join ", "
          Write-Output "::notice title=Windows build::release: $exes; nsis: $setup"
          $ver = & "$rel/ffprobe.exe" -hide_banner -version 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=ffprobe::exit $LASTEXITCODE $ver"; exit 1 }
          Write-Output "::notice title=ffprobe::$($ver | Select-Object -First 1)"
          $app = Get-ChildItem $rel -Filter *.exe | Where-Object { $_.Name -notmatch '^(ffmpeg|ffprobe)' } | Select-Object -First 1
          if (-not $app) { Write-Output "::error title=portable::app exe not found in $exes"; exit 1 }
          $dir = Join-Path $env:RUNNER_TEMP "portable/LightPlayer"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item $app.FullName (Join-Path $dir "LightPlayer.exe")
          Copy-Item "$rel/ffmpeg.exe", "$rel/ffprobe.exe" $dir
          Compress-Archive -Path $dir -DestinationPath (Join-Path $env:RUNNER_TEMP "LightPlayer-portable.zip") -Force
          "LP_APP_EXE=$($app.FullName)" >> $env:GITHUB_ENV
          Get-Item (Join-Path $env:RUNNER_TEMP "LightPlayer-portable.zip")
      - uses: actions/upload-artifact@v4
        with:
          name: LightPlayer-Windows-x64-setup
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: LightPlayer-Windows-x64-portable
          path: ${{ runner.temp }}/LightPlayer-portable.zip
          if-no-files-found: error
      - name: UI screenshot (best effort)
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $rel = "$PWD/src-tauri/target/x86_64-pc-windows-msvc/release"
          $shots = "$env:RUNNER_TEMP/shots-windows"
          New-Item -ItemType Directory -Force $shots | Out-Null
          & "$rel/ffmpeg.exe" -loglevel error -y -f lavfi -i testsrc2=size=1280x720:rate=30 `
            -f lavfi -i sine=frequency=440 -t 20 -c:v libx264 -pix_fmt yuv420p -c:a aac "$env:RUNNER_TEMP/test.mp4"
          $p = Start-Process $env:LP_APP_EXE -ArgumentList "`"$env:RUNNER_TEMP/test.mp4`"" -PassThru
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$shots/$name.png")
          }
          Start-Sleep 12
          Shot "window"
          Start-Sleep 4
          Shot "window-later"
          $alive = -not $p.HasExited
          Write-Output "::notice title=UI smoke test::app still running after 16 s: $alive"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-ChildItem $shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots-windows
          path: ${{ runner.temp }}/shots-windows
          if-no-files-found: ignore
      - name: Speech recognition smoke test (CPU)
        shell: pwsh
        env:
          LP_ASR_MODEL_DIR: ${{ runner.temp }}/models
          LP_ASR_AUDIO: ${{ runner.temp }}/speech.wav
        run: |
          New-Item -ItemType Directory -Force $env:LP_ASR_MODEL_DIR | Out-Null
          curl.exe -fL --retry 3 -o "$env:LP_ASR_MODEL_DIR/ggml-tiny.bin" https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          curl.exe -fL --retry 3 -o "$env:LP_ASR_MODEL_DIR/ggml-silero-v5.1.2.bin" https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v5.1.2.bin
          Add-Type -AssemblyName System.Speech
          $tts = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $tts.SetOutputToWaveFile($env:LP_ASR_AUDIO)
          $tts.Speak("Welcome to the light player. This music player can recognise song lyrics on your computer.")
          $tts.Dispose()
          $env:LIGHTPLAYER_FFMPEG_DIR = "$PWD/src-tauri/target/x86_64-pc-windows-msvc/release"
          cd src-tauri
          $out = cargo test --release --target x86_64-pc-windows-msvc asr_smoke -- --ignored --nocapture 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $out
          $tail = ($out | Select-Object -Last 25) -join "%0A"
          if ($code -ne 0) { Write-Output "::error title=Speech recognition::$tail"; exit 1 }
          Write-Output "::notice title=Speech recognition::$(($out | Select-String '^\[0' | Select-Object -First 3) -join ' ')"
      - name: Rust unit tests (Windows)
        working-directory: src-tauri
        env:
          LIGHTPLAYER_FFMPEG_DIR: ${{ github.workspace }}/src-tauri/target/x86_64-pc-windows-msvc/release
        shell: pwsh
        run: |
          $out = cargo test --release --target x86_64-pc-windows-msvc 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $out
          $sum = ($out | Select-String 'test result|FAILED|panicked' | Select-Object -First 30) -join "%0A"
          if ($code -ne 0) { Write-Output "::error title=Rust tests on Windows::$sum"; exit 1 }
          Write-Output "::notice title=Rust tests on Windows::$sum"

  release:
    name: Publish GitHub release
    # Runs for pushed v* tags, or for a manual run with a release tag (the
    # release then creates the tag on the built commit).
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [build, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LightPlayer-macOS-arm64-dmg
          path: dist-release
      - uses: actions/download-artifact@v4
        with:
          name: LightPlayer-macOS-arm64-app
          path: dist-release
      - uses: actions/download-artifact@v4
        with:
          name: LightPlayer-Windows-x64-setup
          path: dist-release
      - uses: actions/download-artifact@v4
        with:
          name: LightPlayer-Windows-x64-portable
          path: dist-release
      - name: Prepare release files
        run: |
          cd dist-release
          ver="${TAG#v}"
          mv LightPlayer.app.zip "LightPlayer_${ver}_aarch64.app.zip"
          mv LightPlayer-portable.zip "LightPlayer_${ver}_x64_portable.zip"
          ls -la
          test -f "LightPlayer_${ver}_x64-setup.exe"
      - name: Replace an existing release
        if: github.event_name == 'workflow_dispatch' && inputs.replace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          # The tag may exist without a release.
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ (github.event_name == 'workflow_dispatch' && !inputs.prerelease) && format('LightPlayer {0}', env.TAG) || format('LightPlayer {0} 预发布', env.TAG) }}
          body_path: docs/releases/${{ env.TAG }}.md
          # Tag pushes stay prereleases; a manual run can publish a full release.
          prerelease: ${{ github.event_name != 'workflow_dispatch' || inputs.prerelease }}
          make_latest: ${{ (github.event_name == 'workflow_dispatch' && !inputs.prerelease) && 'true' || 'false' }}
          files: |
            dist-release/*.dmg
            dist-release/*.zip
            dist-release/*.exe
          fail_on_unmatched_files: true
