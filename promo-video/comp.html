<!DOCTYPE html>
<!-- LightPlayer 宣传片「一条进度线」 — built with onetake (github.com/feitangyuan/onetake, PolyForm Noncommercial 1.0.0) -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>LightPlayer 宣传片</title>
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--ground,#fbfcfd)}
body{font-family:var(--text);color:var(--ink)}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--ground)}
canvas.full{position:absolute;left:0;top:0;width:1920px;height:1080px}
#world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.abs{position:absolute;left:0;top:0}
/* app windows: real screens of the app, 1280 × 800 css px shot at 2× */
.win{position:absolute;width:1280px;height:800px;transform-origin:0 0;filter:drop-shadow(0 30px 50px rgba(30,50,80,.16)) drop-shadow(0 2px 6px rgba(30,50,80,.08))}
.win .clip{position:absolute;inset:0;overflow:hidden}
.win img{position:absolute;left:0;top:0;width:1280px;height:800px;display:block}
/* the sky of the weather theme */
#sky{position:absolute;left:0;top:0;width:1920px;height:900px;overflow:hidden}
#sky img{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block}
/* lyrics, rebuilt in the app's lyric style */
#lyr{position:absolute;left:0;top:0;width:1920px;height:1080px}
#lyr div{position:absolute;left:0;width:1920px;text-align:center;font:700 60px/1 var(--display);letter-spacing:.02em;white-space:nowrap;transform-origin:960px 50%}
#lyr span{display:inline-block}
/* the vinyl, cut from the app's vinyl player page */
#disc{position:absolute;width:520px;height:520px;border-radius:50%;overflow:hidden;box-shadow:0 30px 60px -20px rgba(20,30,50,.35)}
#disc img{position:absolute;display:block}
/* headlines */
.hl{position:absolute;left:0;top:0;font-family:var(--display);font-weight:700;color:var(--ink);white-space:nowrap;letter-spacing:.04em;line-height:1.18}
.hl > div{display:block}
.hl span{display:inline-block;will-change:transform,opacity}
#mark{position:absolute;left:0;top:0;display:flex;align-items:center;gap:40px}
#mark img{width:150px;height:150px;display:block}
#markText{font:700 150px/1 var(--display);letter-spacing:-.03em;color:var(--ink);white-space:nowrap}
#markText span{display:inline-block;transform-origin:50% 88%}
#tag{position:absolute;left:0;top:0;font:700 46px/1 var(--display);letter-spacing:.08em;color:var(--ink);white-space:nowrap}
#tag b{color:#e8364b;font-weight:700}
#cursor{position:absolute;left:0;top:0;width:24px;height:32px;transform-origin:0 0;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
#heartPop{position:absolute;left:0;top:0;width:18px;height:18px;transform-origin:50% 50%}
#hud{position:absolute;right:14px;bottom:10px;font:13px monospace;color:#c00;display:none}
</style>
<script src="look.js"></script>
</head>
<body>
<div id="stage">
  <canvas id="ground" class="full"></canvas>
  <div id="world">
    <div id="sky"><img id="sky0" src="footage/sky-dusk.png" alt=""><img id="sky1" src="footage/sky-rain.png" alt=""><img id="sky2" src="footage/sky-snow.png" alt=""><img id="sky3" src="footage/sky-night.png" alt=""></div>
    <div id="lyr"></div>
    <div id="disc"><img id="discImg" src="footage/vinyl.png" alt=""></div>
    <div class="win" id="win"><div class="clip" id="winClip"><img id="wa" src="footage/daily-a.png" alt=""><img id="wb" src="footage/daily-b.png" alt=""></div><div class="clip" id="panelClip"><img src="footage/daily-c.png" alt=""></div></div>
    <div class="win" id="wl"><div class="clip"><img src="footage/vinyl.png" alt=""></div></div>
    <div class="win" id="wr"><div class="clip"><img src="footage/dark.png" alt=""></div></div>
    <svg id="heartPop" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.9 4.5 6.6 4.5c2.2 0 3.7 1.2 5.4 3.2 1.7-2 3.2-3.2 5.4-3.2 3.7 0 5.7 3.9 4.2 7.3C19.5 16.4 12 21 12 21z" fill="#fb4a68"/></svg>
    <svg id="cursor" viewBox="0 0 34 44"><path d="M4 3 L30 22 L18 24 L26 40 L20 43 L12 27 L4 36 Z" fill="#111" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/></svg>
  </div>
  <canvas id="line" class="full"></canvas>
  <div id="heads"></div>
  <div id="mark"><img id="icon" src="footage/icon.png" alt=""><div id="markText"></div></div>
  <div id="tag">现已支持<b>网易云音乐</b></div>
  <div id="hud"></div>
</div>
<script src="motion.js"></script>
<script>
// ══════════════════════════════════════════════════════════════════════════════════════════════
// One line is the whole film: it is drawn, becomes the progress bar of the real player, the bar
// grows into the app (NetEase: daily picks, the heart, the comments), the line lifts off as the
// underline of the lyrics, winds into the vinyl's groove, unrolls into the horizon of the weather
// sky, links two computers, and ends under the name. Everything is a pure function of t.
// ══════════════════════════════════════════════════════════════════════════════════════════════
const DUR = 26.5;
window.__meta = { dur: DUR, fps: 30, w: 1920, h: 1080 };
const { clamp, lerp, seg, sstep, ssstep, ease, spring } = OM;
const E = ease;
const $ = id => document.getElementById(id);

// ───────────── geometry (world = the 1920 × 1080 layout at zoom 1) ─────────────
const WIN = { x: 320, y: 140, w: 1280, h: 800 };                       // the app window
const L2W = (x, y) => [WIN.x + x, WIN.y + y];                            // window-local (css px of the shot) → world
const TRACK = { x0: 417, x1: 1503, y: 864 };                            // the hidden progress slider, from footage/rects.json
const TLEN = TRACK.x1 - TRACK.x0;
const BAR = { x: 10, y: 709, w: 1260, h: 81 };                           // the player bar (window-local)
const FULL = { x: 0, y: 0, w: 1280, h: 800 };
const SLIT = { x: 97, y: 722, w: 1086, h: 4 };
const HEART = L2W(161, 760), CMT = L2W(956, 760);
const CMT_R = { x: 939, y: 743, w: 34, h: 34 }, PANEL_R = { x: 886, y: 52, w: 380, h: 634 };
const DISC = { cx: 720, cy: 540, r: 260 };                              // the vinyl, world
const DISC_SRC = { x: 439.1, y: 132.2, d: 401.8 };                       // the disc in vinyl.png (css px)
const HORIZON = 900;
const LAN_S = 0.42, WL = { x: 150, y: 330 }, WR = { x: 1232, y: 330 };   // two computers
const LAN_Y = WL.y + 724 * LAN_S;
const LTR = { a0: WL.x + 97 * LAN_S, a1: WL.x + 1183 * LAN_S, b0: WR.x + 97 * LAN_S, b1: WR.x + 1183 * LAN_S };
const UNDER = { x0: 690, x1: 1230, y: 640 };                             // under the name

// ───────────── timeline ─────────────
const T = {
  dot: 0.35, draw0: 0.8, draw1: 1.8,
  bar0: 2.6, bar1: 3.2, rew0: 2.7, rew1: 3.15, win0: 3.3, win1: 4.1,
  h1: 4.1, h1out: 5.3,
  click1: 6.0, h2: 6.15, h2out: 7.0,
  click2: 7.55, panel0: 7.6, panel1: 8.15, h3: 8.25, h3out: 9.35,
  lift0: 9.8, lift1: 10.4, winOut0: 9.35, winOut1: 9.85, lyrIn: 10.0, lyr: [10.95, 11.6, 12.2], lyrOut: 12.6,
  wind0: 12.6, wind1: 13.35, discIn0: 13.05, discIn1: 13.6, h4: 13.6, h4out: 15.15,
  unwind0: 15.4, unwind1: 16.1, discOut0: 15.25, discOut1: 15.6, sky0: 16.0, sky1: 16.6, h5: 16.55, h5out: 18.7,
  cuts: [17.3, 17.65, 18.0], drain0: 18.8, drain1: 19.3,
  lan0: 18.95, lan1: 19.55, lanBar0: 19.55, lanBar1: 19.95, lanWin0: 20.0, lanWin1: 20.6, h6: 20.55, h6out: 22.35,
  lanOut0: 22.4, lanOut1: 22.85, end0: 22.8, end1: 23.4, mark: 23.15, tag: 23.75,
};

// ───────────── camera: keyed, with an operator's hand and shakes on the landings ─────────────
const KEYS = [
  { t: 0, x: 417, y: 864, zoom: 2.6 },
  { t: T.draw0, x: 417, y: 864, zoom: 2.6 },
  { t: 1.9, x: 960, y: 864, zoom: 1.72, curve: E.quintOut },               // chases the head of the line
  { t: T.bar0, x: 960, y: 864, zoom: 1.72 },
  { t: 3.25, x: 960, y: 872, zoom: 1.32, curve: E.cubicInOut },            // the bar forms
  { t: 4.15, x: 680, y: 540, zoom: 0.86, curve: E.cubicInOut },            // the app grows out of it
  { t: 5.3, x: 680, y: 540, zoom: 0.86 },
  { t: 5.8, x: 560, y: 905, zoom: 2.2, curve: E.expoInOut },               // to the heart
  { t: 7.0, x: 560, y: 905, zoom: 2.2 },
  { t: 7.45, x: 1276, y: 905, zoom: 2.2, curve: E.expoInOut },             // whip to the comments button
  { t: 7.6, x: 1276, y: 905, zoom: 2.2 },
  { t: 8.25, x: 1578, y: 509, zoom: 1.1, curve: E.cubicInOut },            // pulled back by the panel
  { t: 9.4, x: 1578, y: 509, zoom: 1.1 },
  { t: 10.45, x: 960, y: 540, zoom: 1.0, curve: E.quintInOut },            // the window folds into the line; ride it to the lyrics
  { t: T.wind0, x: 960, y: 540, zoom: 1.0 },
  { t: 13.4, x: 930, y: 540, zoom: 1.08, curve: E.cubicInOut },            // lean in as it winds
  { t: T.unwind0, x: 930, y: 540, zoom: 1.08 },
  { t: 16.15, x: 960, y: 540, zoom: 1.0, curve: E.cubicInOut },            // back out for the horizon
  { t: T.drain0, x: 960, y: 540, zoom: 1.0 },
  { t: 19.6, x: 960, y: 520, zoom: 0.97, curve: E.cubicInOut },
  { t: T.lanOut0, x: 960, y: 520, zoom: 0.97 },
  { t: 23.5, x: 960, y: 560, zoom: 1.0, curve: E.cubicInOut },
];
const HITS = [[T.dot, 3, 12], [T.click1, 5, 10], [T.click2, 4, 10], [T.panel1, 3, 9], [T.discIn1, 4, 9], [T.sky1, 3, 9], [T.lanWin1, 3, 9], [T.mark + 0.25, 4, 9]];
const holds = [[1.95, 2.55], [4.2, 5.25], [6.25, 6.95], [8.4, 9.35], [16.7, 17.25], [23.9, DUR]];
const handEnv = t => { let e = sstep(0.4, 1.0, t); for (const [a, b] of holds) e *= 1 - sstep(a - 0.15, a, t) * (1 - sstep(b, b + 0.15, t)); return e; };
function camAt(t) {
  const c = OM.camera(t, KEYS), e = handEnv(t) * 3.2;
  let x = c.x + e * (Math.sin(1.7 * t) + 0.6 * Math.sin(2.9 * t + 1)) / c.zoom;
  let y = c.y + e * (Math.sin(1.3 * t + 2) + 0.5 * Math.sin(3.3 * t)) / c.zoom;
  let rot = c.rot;
  for (const [th, amp, decay] of HITS) { const s = OM.shake(t, th, { amp, decay, seed: Math.round(th * 100) }); x += s.x / c.zoom; y += s.y / c.zoom; rot += s.rot; }
  return { x, y, zoom: c.zoom, rot };
}

// ───────────── the hand (NetEase beats only) ─────────────
const HAND = [
  { t: 5.35, x: 700, y: 1130 }, { t: 5.75, x: 530, y: 960 }, { t: 5.95, x: HEART[0] + 2, y: HEART[1] + 3 }, { t: 6.9, x: HEART[0] + 2, y: HEART[1] + 3 },
  { t: 7.45, x: CMT[0] + 2, y: CMT[1] + 3 }, { t: 7.9, x: CMT[0] + 2, y: CMT[1] + 3 }, { t: 8.3, x: 1360, y: 1080 }, { t: 8.7, x: 1460, y: 1180 },
];
const CLICKS = [T.click1, T.click2];

// ───────────── progress: the line is the song's position ─────────────
function progress(t) {   // fraction of the track filled
  if (t < T.rew0) return 1;
  const p = 0.05 + 0.33 * clamp((t - T.rew1) / (T.lift0 - T.rew1));
  return lerp(1, p, E.expoInOut(seg(t, T.rew0, T.rew1)));
}
function lanProgress(t) { return 0.12 + 0.3 * clamp((t - T.lanBar0) / (T.lanOut0 - T.lanBar0)); }

// ───────────── lyrics ─────────────
const LYRICS = ['晚风经过窗台', '把灯光吹成海', '你说慢一点也没关系', '我们还有整个夏天', '星星落在耳边', '旋律替我说完'];
const LY = { y: 520, gap: 92, small: 0.7 };
const lyrEls = LYRICS.map(s => { const d = document.createElement('div'); d.innerHTML = `<span>${s}</span>`; $('lyr').appendChild(d); return d; });
let lyrW = [];
function lyrScroll(t) {   // continuous index of the active line
  let s = 0;
  T.lyr.forEach(tl => { s += spring(t - tl, 0.72, 15); });
  return s;
}
function underline(t) {   // the line under the active lyric: [x0, x1, y]
  const s = lyrScroll(t), i = Math.floor(s), f = s - i;
  const w = lerp(lyrW[i] ?? 0, lyrW[i + 1] ?? lyrW[i], f) + 24;
  return [960 - w / 2, 960 + w / 2, LY.y + 48];
}

// ───────────── the line, as polylines in world space ─────────────
const N = 220;
const straight = (x0, x1, y) => Array.from({ length: N }, (_, i) => [lerp(x0, x1, i / (N - 1)), y]);
const spin = t => { const k = clamp(t - T.wind0); return 0.55 * 2 * Math.PI * Math.max(0, t - T.wind0 - 0.5 + 0.5 * (1 - k) * k); };
function spiral(t) {   // outer groove inwards; turns with the record
  const a0 = -Math.PI * 0.5 + spin(t), turns = 4, r0 = 252, r1 = 182;   // the groove ring, outside the label
  return Array.from({ length: N }, (_, i) => { const u = i / (N - 1), a = a0 + u * turns * 2 * Math.PI, r = lerp(r0, r1, u);
    return [DISC.cx + Math.cos(a) * r, DISC.cy + Math.sin(a) * r]; });
}
const mix = (A, B, k) => A.map((p, i) => [lerp(p[0], B[i][0], k), lerp(p[1], B[i][1], k)]);
const mixStagger = (A, B, t, t0, t1, curve, spread = 0.35) => A.map((p, i) => { const u = i / (A.length - 1), d = (t1 - t0) * spread;
  const k = curve(seg(t, t0 + u * d, t1 - (1 - u) * d)); return [lerp(p[0], B[i][0], k), lerp(p[1], B[i][1], k)]; });

const ACC = '#66ccff', TRK = 'rgba(120,135,155,.22)';
// → [{pts, w, color, alpha, dash?}]
function lineAt(t) {
  const out = [];
  if (t < T.dot) return out;
  if (t < T.bar0) {                                                            // a dot, then a line drawn left to right
    const pop = spring(t - T.dot, 0.5, 22), head = TRACK.x0 + TLEN * E.expoOut(seg(t, T.draw0, T.draw1));
    out.push({ pts: straight(TRACK.x0, Math.max(TRACK.x0 + 0.01, head), TRACK.y), w: 7 * pop, color: ACC });
    return out;
  }
  if (t < T.lift0) {                                                           // the progress bar of the player
    const w = lerp(7, 4, E.cubicInOut(seg(t, T.bar0, T.bar1)));
    const tr = sstep(T.rew0, T.rew0 + 0.3, t) * (1 - sstep(T.winOut0, T.winOut1, t));
    if (tr > 0) out.push({ pts: straight(TRACK.x0, TRACK.x1, TRACK.y), w, color: TRK, alpha: tr });
    out.push({ pts: straight(TRACK.x0, TRACK.x0 + TLEN * progress(t), TRACK.y), w, color: ACC });
    return out;
  }
  if (t < T.wind0) {                                                           // lifts off into the lyrics' underline
    const tr = 1 - sstep(T.winOut0, T.winOut1, t);
    if (tr > 0) out.push({ pts: straight(TRACK.x0, TRACK.x1, TRACK.y), w: 4, color: TRK, alpha: tr });
    const p = progress(T.lift0), A = straight(TRACK.x0, TRACK.x0 + TLEN * p, TRACK.y), u = underline(t);
    out.push({ pts: mix(A, straight(u[0], u[1], u[2]), E.expoInOut(seg(t, T.lift0, T.lift1))), w: lerp(4, 6, seg(t, T.lift0, T.lift1)), color: ACC });
    return out;
  }
  if (t < T.unwind0) {                                                         // winds into the groove
    const u = underline(T.wind0), A = straight(u[0], u[1], u[2]);
    const k = E.expoInOut(seg(t, T.wind0, T.wind1));
    out.push({ pts: mixStagger(A, spiral(t), t, T.wind0, T.wind1, E.expoInOut), w: lerp(6, 3.2, k), color: ACC, alpha: 1 - 0.45 * sstep(T.discIn0, T.discIn1, t) });
    return out;
  }
  if (t < T.lan0) {                                                            // unrolls into the horizon
    const B = straight(-120, 2040, HORIZON);
    out.push({ pts: mixStagger(spiral(t), B, t, T.unwind0, T.unwind1, E.expoInOut, 0.3), w: lerp(3.2, 4, seg(t, T.unwind0, T.unwind1)), color: ACC,
      alpha: lerp(0.55, 1, seg(t, T.unwind0, T.unwind0 + 0.3)) });
    return out;
  }
  if (t < T.lanOut0 + 0.01 || t < T.end0) {                                    // links two computers
    const A = straight(-120, 2040, HORIZON), B = straight(LTR.a0, LTR.b1, LAN_Y);
    const k = E.expoInOut(seg(t, T.lan0, T.lan1));
    const split = sstep(T.lanBar0, T.lanBar1, t) * (1 - sstep(T.lanOut0, T.lanOut1, t));
    const whole = mix(A, B, k);
    const back = seg(t, T.end0, T.end1);
    if (split <= 0) {
      const C = straight(UNDER.x0, UNDER.x1, UNDER.y);
      out.push({ pts: t >= T.end0 ? mix(B, C, E.expoInOut(back)) : whole, w: lerp(4, 5, back), color: ACC });
      return out;
    }
    const p = lanProgress(t), sw = 4;
    for (const [a0, a1] of [[LTR.a0, LTR.a1], [LTR.b0, LTR.b1]]) {
      out.push({ pts: straight(a0, a1, LAN_Y), w: sw, color: TRK, alpha: split });
      out.push({ pts: straight(a0, lerp(a1, a0 + (a1 - a0) * p, split), LAN_Y), w: sw, color: ACC });
    }
    out.push({ pts: straight(LTR.a1 + 14 * split, LTR.b0 - 14 * split, LAN_Y), w: lerp(sw, 2.5, split), color: ACC, alpha: lerp(1, 0.55, split), dash: split > 0.5 ? [2, 12] : null });
    return out;
  }
  out.push({ pts: straight(UNDER.x0, UNDER.x1, UNDER.y), w: 5, color: ACC });
  return out;
}
// pulses running along the link, left to right, while the two play together
function pulses(t) {
  if (t < T.lanBar1 || t > T.lanOut0) return [];
  const on = sstep(T.lanBar1, T.lanBar1 + 0.3, t) * (1 - sstep(T.lanOut0 - 0.3, T.lanOut0, t));
  return [0, 0.5].map(o => { const u = ((t - T.lanBar1) / 1.1 + o) % 1; return { x: lerp(LTR.a1 + 14, LTR.b0 - 14, E.smooth(u)), y: LAN_Y, a: on * Math.sin(Math.PI * u) }; });
}

// ───────────── headlines (screen space) ─────────────
const HEADS = [
  { lines: ['网易云音乐', '也在这里'], x: 140, y: 372, size: 92, t: T.h1, out: T.h1out },
  { lines: ['点亮红心'], x: 960, y: 780, size: 84, t: T.h2, out: T.h2out, center: true },
  { lines: ['一起看评论'], x: 1090, y: 470, size: 84, t: T.h3, out: T.h3out },
  { lines: ['让唱片', '转起来'], x: 1160, y: 392, size: 96, t: T.h4, out: T.h4out },
  { lines: ['窗外的天气', '就是主题'], x: 150, y: 300, size: 96, t: T.h5, out: T.h5out, color: '#ffffff', shadow: true },
  { lines: ['两台电脑 同步播放'], x: 960, y: 128, size: 80, t: T.h6, out: T.h6out, center: true },
];
HEADS.forEach(h => {
  const d = document.createElement('div'); d.className = 'hl'; d.style.fontSize = h.size + 'px';
  if (h.color) d.style.color = h.color;
  if (h.shadow) d.style.textShadow = '0 4px 30px rgba(10,20,40,.35)';
  d.innerHTML = h.lines.map(l => `<div>${[...l].map(c => `<span>${c === ' ' ? '&nbsp;' : c}</span>`).join('')}</div>`).join('');
  $('heads').appendChild(d); h.el = d; h.spans = [...d.querySelectorAll('span')];
});
const markL = [...'LightPlayer'].map(ch => { const s = document.createElement('span'); s.textContent = ch; $('markText').appendChild(s); return s; });

// ───────────── drawing ─────────────
const DPR = window.devicePixelRatio || 1;
const lc = $('line'), lx = lc.getContext('2d'), gc = $('ground'), gx = gc.getContext('2d');
for (const c of [lc, gc]) { c.width = 1920 * DPR; c.height = 1080 * DPR; }
const css = (el, s) => { el.style.cssText += s; };
const M2css = M => `matrix(${M.map(v => +v.toFixed(5)).join(',')})`;
const inset = (R, r = 12) => `inset(${R.y.toFixed(2)}px ${(1280 - R.x - R.w).toFixed(2)}px ${(800 - R.y - R.h).toFixed(2)}px ${R.x.toFixed(2)}px round ${r.toFixed(2)}px)`;
const show = (el, on) => { el.style.display = on ? '' : 'none'; };

function winRect(t, a0, a1, b0, b1) {   // the line opens into the bar, the bar into the window
  if (t < a0) return null;
  const k1 = E.expoOut(seg(t, a0, a1));
  let R = OM.morphRect(t, a0, a1, SLIT, BAR, { curve: E.expoOut });
  if (t >= b0) R = OM.morphRect(t, b0, b1, BAR, FULL, { curve: E.expoInOut });
  return { R, r: lerp(2, 12, k1) };
}

function winRectFold(t) {   // the main window: opens from the line, and folds back into it
  if (t < T.winOut0) return winRect(t, T.bar0, T.bar1, T.win0, T.win1);
  const k = E.expoInOut(seg(t, T.winOut0, T.winOut1));
  return { R: { x: lerp(FULL.x, SLIT.x, k), y: lerp(FULL.y, SLIT.y, k), w: lerp(FULL.w, SLIT.w, k), h: lerp(FULL.h, SLIT.h, k) }, r: lerp(12, 2, k) };
}

function drawGround(cam) {
  gx.setTransform(1, 0, 0, 1, 0, 0); gx.fillStyle = LOOK.color.ground; gx.fillRect(0, 0, gc.width, gc.height);
  const G = OM.lattice(cam, { depth: 1.2, spacing: 48, px: 1.5 });
  gx.setTransform(...G.matrix.map((v, i) => v * DPR));
  gx.fillStyle = 'rgba(140,155,175,.22)';
  for (let x = G.x0; x <= G.x1; x += G.spacing) for (let y = G.y0; y <= G.y1; y += G.spacing) { gx.beginPath(); gx.arc(x, y, G.r, 0, 6.2832); gx.fill(); }
}

function drawLine(t, V) {
  lx.setTransform(1, 0, 0, 1, 0, 0); lx.clearRect(0, 0, lc.width, lc.height);
  lx.setTransform(...V.map(v => v * DPR));
  lx.lineCap = 'round'; lx.lineJoin = 'round';
  for (const s of lineAt(t)) {
    if (s.w <= 0.01 || (s.alpha ?? 1) <= 0.005) continue;
    lx.globalAlpha = s.alpha ?? 1; lx.strokeStyle = s.color; lx.lineWidth = s.w; lx.setLineDash(s.dash || []);
    lx.beginPath(); s.pts.forEach((p, i) => i ? lx.lineTo(p[0], p[1]) : lx.moveTo(p[0], p[1])); lx.stroke();
  }
  lx.setLineDash([]);
  for (const p of pulses(t)) { lx.globalAlpha = p.a; lx.fillStyle = ACC; lx.beginPath(); lx.arc(p.x, p.y, 6, 0, 6.2832); lx.fill(); }
  // the dot before the line
  if (t >= T.dot && t < T.draw0 + 0.05) { const pop = spring(t - T.dot, 0.5, 22); lx.globalAlpha = 1; lx.fillStyle = ACC; lx.beginPath(); lx.arc(TRACK.x0, TRACK.y, 9 * pop, 0, 6.2832); lx.fill(); }
  lx.globalAlpha = 1;
}

function heads(t) {
  for (const h of HEADS) {
    const vis = t >= h.t - 0.05 && t < h.out + 0.4; show(h.el, vis); if (!vis) continue;
    const w = h.w, x = h.center ? h.x - w / 2 : h.x;
    const o = OM.liftOut(t, h.out, { dist: 50, blur: 8 });
    h.el.style.transform = `translate(${x.toFixed(1)}px,${(h.y + o.dy).toFixed(1)}px)`;
    h.el.style.opacity = o.op; h.el.style.filter = o.blur > 0.2 ? `blur(${o.blur.toFixed(1)}px)` : 'none';
    h.spans.forEach((s, i) => { const w = OM.wordRise(t, h.t + i * 0.045, { dist: 34, zeta: 0.62, omega: 20 });
      s.style.opacity = w.op; s.style.transform = `translateY(${w.y.toFixed(1)}px) scale(${w.s.toFixed(4)})`; });
  }
}

let TRACKBOX = {};
function seek(t) {
  const CAM = camAt(t), V = OM.view(CAM);
  drawGround(CAM);
  $('world').style.transform = M2css(V);

  // the app window (NetEase): bar from the line, window from the bar, heart, comments
  { const el = $('win'), vis = t >= T.bar0 && t < T.winOut1 + 0.05; show(el, vis);
    if (vis) {
      const w = winRectFold(t);
      el.style.left = WIN.x + 'px'; el.style.top = WIN.y + 'px';
      el.style.opacity = 1;
      $('winClip').style.clipPath = inset(w.R, w.r);
      $('wb').style.opacity = t >= T.click1 + 0.03 ? 1 : 0;
      const pk = E.expoOut(seg(t, T.panel0, T.panel1));
      const pv = t >= T.panel0;
      show($('panelClip'), pv); $('panelClip').style.opacity = 1 - sstep(T.winOut0 - 0.05, T.winOut0 + 0.15, t);
      if (pv) { const R = OM.morphRect(t, T.panel0, T.panel1, CMT_R, PANEL_R, { curve: E.expoOut }); $('panelClip').style.clipPath = inset(R, lerp(17, 14, pk)); }
    } }
  // the heart lands with a squash
  { const el = $('heartPop'), vis = t >= T.click1 && t < T.click1 + 0.7; show(el, vis);
    if (vis) { const k = spring(t - T.click1, 0.35, 26), im = OM.impact(t, T.click1 + 0.05, { decay: 8, omega: 24, sqx: 0.2, sqy: 0.24 });
      const s = lerp(0.4, 1, k) * 1.0; el.style.transform = `translate(${HEART[0] - 9}px,${HEART[1] - 9}px) scale(${(s * im.sx).toFixed(3)},${(s * im.sy).toFixed(3)})`; } }
  // the hand
  { const vis = t >= HAND[0].t && t < HAND[HAND.length - 1].t; show($('cursor'), vis);
    if (vis) { const c = OM.cursor(t, HAND, CLICKS); $('cursor').style.transform = `translate(${(c.x - 3).toFixed(1)}px,${(c.y - 2).toFixed(1)}px) scale(${(c.s * 0.75).toFixed(3)})`; } }

  // lyrics: lines scroll, the active one at full size
  { const vis = t >= T.lyrIn - 0.05 && t < T.lyrOut + 0.45; show($('lyr'), vis);
    if (vis) {
      const s = lyrScroll(t), op = sstep(T.lyrIn, T.lyrIn + 0.45, t) * (1 - sstep(T.lyrOut, T.lyrOut + 0.35, t));
      lyrEls.forEach((el, i) => { const d = i - s, big = clamp(1 - Math.abs(d));
        const sc = lerp(LY.small, 1, big), y = LY.y + d * LY.gap + (d > 0 ? 6 : 0) - 30;
        const fade = clamp(1 - (Math.abs(d) - 1.6) / 1.2) * (d < -1.4 ? clamp(1 - (-d - 1.4) / 0.6) : 1);
        el.style.transform = `translateY(${y.toFixed(1)}px) scale(${sc.toFixed(4)})`;
        el.style.color = big > 0.5 ? LOOK.color.ink : LOOK.color.mute;
        el.style.opacity = (op * fade * (0.45 + 0.55 * big)).toFixed(3); });
    } }
  // the vinyl
  { const vis = t >= T.discIn0 && t < T.discOut1; show($('disc'), vis);
    if (vis) { const kin = E.expoOut(seg(t, T.discIn0, T.discIn1)), kout = E.expoIn(seg(t, T.discOut0, T.discOut1));
      const s = lerp(0.82, 1, kin) * lerp(1, 0.2, kout), el = $('disc');
      el.style.left = (DISC.cx - DISC.r) + 'px'; el.style.top = (DISC.cy - DISC.r) + 'px';
      el.style.opacity = kin * (1 - kout);
      el.style.transform = `scale(${s.toFixed(4)}) rotate(${(spin(t) * 180 / Math.PI).toFixed(2)}deg)`;
      const k = 520 / DISC_SRC.d, img = $('discImg');
      img.style.width = (1280 * k) + 'px'; img.style.height = (800 * k) + 'px';
      img.style.left = (-DISC_SRC.x * k) + 'px'; img.style.top = (-DISC_SRC.y * k) + 'px'; } }
  // the weather sky rises from the horizon, cuts through four weathers, drains back
  { const vis = t >= T.sky0 && t < T.drain1; show($('sky'), vis);
    if (vis) { const up = E.expoOut(seg(t, T.sky0, T.sky1)), down = E.expoInOut(seg(t, T.drain0, T.drain1));
      const top = HORIZON * (1 - up + down);
      $('sky').style.clipPath = `inset(${top.toFixed(1)}px 0 0 0)`;
      const n = T.cuts.filter(c => t >= c).length;
      for (let i = 0; i < 4; i++) $('sky' + i).style.display = i === n ? '' : 'none'; } }
  // two computers on one line
  for (const [id, P, d] of [['wl', WL, 0], ['wr', WR, 0.06]]) {
    const el = $(id), vis = t >= T.lanBar0 && t < T.lanOut1; show(el, vis); if (!vis) continue;
    let w = winRect(t, T.lanBar0 + d, T.lanBar1 + d, T.lanWin0 + d, T.lanWin1 + d);
    if (!w) { show(el, false); continue; }
    if (t >= T.lanOut0) { const k = E.expoInOut(seg(t, T.lanOut0, T.lanOut1)); const R0 = FULL, R1 = SLIT;
      w = { R: { x: lerp(R0.x, R1.x, k), y: lerp(R0.y, R1.y, k), w: lerp(R0.w, R1.w, k), h: lerp(R0.h, R1.h, k) }, r: lerp(12, 2, k) }; }
    el.style.transform = `translate(${P.x}px,${P.y}px) scale(${LAN_S})`;
    el.style.opacity = 1;
    el.firstChild.style.clipPath = inset(w.R, w.r);
  }

  drawLine(t, V);
  heads(t);

  // the name
  { const vis = t >= T.mark - 0.3; show($('mark'), vis); show($('tag'), t >= T.tag - 0.05);
    if (vis) {
      const ic = OM.popIn(t, T.mark - 0.12, { rise: 30, s0: 0.6, ds: 0.4 });
      $('icon').style.opacity = ic.op; $('icon').style.transform = `translateY(${ic.dy.toFixed(1)}px) scale(${ic.s.toFixed(4)})`;
      markL.forEach((s, i) => { const d = OM.letterDrop(t, T.mark, i, { stagger: 0.045 });
        s.style.opacity = d.op; s.style.transform = `translateY(${d.y.toFixed(1)}px) scale(${(1 + d.sq * 0.6).toFixed(4)},${(1 - d.sq).toFixed(4)})`; });
      const P = OM.project(V, 960, UNDER.y);
      $('mark').style.transform = `translate(${(P[0] - MARK_W / 2).toFixed(1)}px,${(P[1] - 40 - 150).toFixed(1)}px) scale(${(CAM.zoom).toFixed(4)})`;
      $('mark').style.transformOrigin = `${MARK_W / 2}px 190px`;
      const tg = OM.wordRise(t, T.tag, { dist: 24 });
      $('tag').style.opacity = tg.op;
      $('tag').style.transform = `translate(${(P[0] - TAG_W / 2).toFixed(1)}px,${(P[1] + 50 * CAM.zoom + tg.y).toFixed(1)}px) scale(${(tg.s * CAM.zoom).toFixed(4)})`;
      $('tag').style.transformOrigin = `${TAG_W / 2}px 0px`;
    } }

  TRACKBOX = track(t, V);
  $('hud').textContent = 't=' + t.toFixed(3);
  return Promise.resolve();
}

// screen boxes of what the story is about (probe, framing, shutter)
function track(t, V) {
  const out = {};
  const segs = lineAt(t);
  if (segs.length) { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const s of segs) for (const p of s.pts) { const q = OM.project(V, p[0], p[1]); x0 = Math.min(x0, q[0]); y0 = Math.min(y0, q[1]); x1 = Math.max(x1, q[0]); y1 = Math.max(y1, q[1]); }
    out.line = { x: x0, y: y0 - 3, w: Math.max(6, x1 - x0), h: Math.max(6, y1 - y0 + 6), op: 1 }; }
  if (t >= T.bar0 && t < T.winOut1) { const w = winRectFold(t); out.win = OM.projectBox(V, { x: WIN.x + w.R.x, y: WIN.y + w.R.y, w: w.R.w, h: w.R.h, op: 1 }); }
  if (t >= T.panel0 && t < T.winOut0 + 0.15) { const R = OM.morphRect(t, T.panel0, T.panel1, CMT_R, PANEL_R, { curve: E.expoOut }); out.panel = OM.projectBox(V, { x: WIN.x + R.x, y: WIN.y + R.y, w: R.w, h: R.h, op: 1 }); }
  if (t >= T.discIn0 && t < T.discOut1) out.disc = OM.projectBox(V, { x: DISC.cx - DISC.r, y: DISC.cy - DISC.r, w: 2 * DISC.r, h: 2 * DISC.r, op: 1 });
  if (t >= HAND[0].t && t < HAND[HAND.length - 1].t) { const c = OM.spline(HAND, t), q = OM.project(V, c[0], c[1]); out.hand = { x: q[0], y: q[1], w: 20, h: 28, op: 1 }; }
  if (t >= T.mark) { const r = $('mark').getBoundingClientRect(); out.mark = { x: r.x, y: r.y, w: r.width, h: r.height, op: 1 }; }
  return out;
}
window.__track = t => { seek(t); return TRACKBOX; };
window.__motion = (t0, t1) => {
  const tm = (t0 + t1) / 2, c0 = camAt(t0), c1 = camAt(t1), d = OM.screenTravel(c0, c1, camAt(tm));
  const b0 = track(t0, OM.view(c0)), b1 = track(t1, OM.view(c1));
  let e = 0;
  for (const k of Object.keys(b0)) if (b1[k]) { const A = b0[k], B = b1[k];
    e = Math.max(e, Math.abs(A.x - B.x), Math.abs(A.y - B.y), Math.abs(A.x + A.w - B.x - B.w), Math.abs(A.y + A.h - B.y - B.h)); }
  // the vinyl turns and the line winds: the far edge of the disc travels with it
  if (t1 > T.discIn0 && t0 < T.discOut1) e = Math.max(e, Math.abs(spin(t1) - spin(t0)) * DISC.r * c0.zoom);
  if (t1 > T.wind0 && t0 < T.unwind1) e = Math.max(e, 60);
  return Math.max(d, e);
};
window.__meta.inFrame = { line: [0.4, DUR], mark: [T.mark + 0.6, DUR, 'whole'] };
window.__meta.cuts = T.cuts;

window.__seek = async t => { await seek(t); return true; };
let MARK_W = 0, TAG_W = 0;
function measure() {
  lyrW = lyrEls.map(el => el.firstChild.getBoundingClientRect().width);
  for (const h of HEADS) { h.el.style.display = ''; h.el.style.transform = 'none'; h.w = h.el.getBoundingClientRect().width; }
  $('mark').style.transform = 'none'; $('tag').style.transform = 'none';
  MARK_W = $('mark').getBoundingClientRect().width; TAG_W = $('tag').getBoundingClientRect().width;
}
const imgs = [...document.images].map(i => i.decode().catch(() => {}));
window.__ready = Promise.all([LOOK.ready, document.fonts.ready, ...imgs]).then(() => { measure(); return seek(0); });
const q = new URLSearchParams(location.search);
if (q.has('t')) __ready.then(() => seek(parseFloat(q.get('t'))));
if (q.has('hud')) $('hud').style.display = 'block';
if (q.has('play')) __ready.then(() => { const t0 = performance.now(); (function loop() { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); })(); });
</script>
</body>
</html>
