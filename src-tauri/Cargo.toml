[package]
name = "lightplayer"
version = "1.4.0"
description = "LightPlayer desktop media player"
edition = "2021"
rust-version = "1.80"

[lib]
name = "lightplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "process", "sync", "time"] }
axum = "0.8"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
lofty = "0.25"
whisper-rs = "0.16"
sha1 = "0.10"
hex = "0.4"
chardetng = "1"
encoding_rs = "0.8"
natord = "1"
zhconv = "0.4"
rand = "0.8"
base64 = "0.22"
thiserror = "2"
once_cell = "1"
log = "0.4"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ecb = { version = "0.1", features = ["alloc"] }
md-5 = "0.10"
num-bigint = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
souvlaki = "0.8"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-location = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
souvlaki = "0.8"
tauri-plugin-single-instance = "2"
trash = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
